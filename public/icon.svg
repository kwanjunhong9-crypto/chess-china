<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="woodBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fdf2d8"/>
      <stop offset="35%" stop-color="#eed5aa"/>
      <stop offset="70%" stop-color="#c99554"/>
      <stop offset="100%" stop-color="#8a531e"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="pieceShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1c1917" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="carve" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#450a0a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#181512"/>

  <!-- Xiangqi Grid Accent Lines -->
  <g stroke="#3a2e22" stroke-width="2" opacity="0.6">
    <line x1="60" y1="120" x2="452" y2="120" />
    <line x1="60" y1="200" x2="452" y2="200" />
    <line x1="60" y1="312" x2="452" y2="312" />
    <line x1="60" y1="392" x2="452" y2="392" />
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="200" y1="60" x2="200" y2="452" />
    <line x1="312" y1="60" x2="312" y2="452" />
    <line x1="392" y1="60" x2="392" y2="452" />
  </g>

  <!-- Chess Piece Outer Rim -->
  <circle cx="256" cy="256" r="186" fill="url(#goldRim)" filter="url(#pieceShadow)"/>
  
  <!-- Chess Piece Inner Wooden Body -->
  <circle cx="256" cy="256" r="172" fill="url(#woodBg)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="14 6" opacity="0.7"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#78350f" stroke-width="2.5" opacity="0.85"/>

  <!-- Red Chinese Character: 帥 (Shuai / Marshal) -->
  <g filter="url(#carve)" fill="#b91c1c" font-family="'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="250">帥</text>
  </g>

  <!-- Small Seal / Tag -->
  <rect x="226" y="370" width="60" height="22" rx="4" fill="#991b1b" opacity="0.9"/>
  <text x="256" y="384" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="central" letter-spacing="2">象棋</text>
</svg>
